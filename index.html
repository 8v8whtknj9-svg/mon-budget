<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101713"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Mon Budget</title><style>
:root{color-scheme:dark;--bg:#101713;--card:#1c2821;--fg:#f0f8f2;--muted:#a6b5ac;--green:#78e5a5;--red:#ff9292}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:480px;margin:auto;padding: max(24px,env(safe-area-inset-top)) 20px 110px}h1{font-size:34px;letter-spacing:-1.5px;margin:12px 0 22px}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer;background:var(--card);border-radius:20px;padding:15px;transition:transform .15s}button:active{transform:scale(.96)}.tabs,.actions{display:flex;gap:8px}.tabs{background:var(--card);border-radius:30px;padding:4px}.tabs button{flex:1;background:transparent;padding:10px}.tabs .active{background:#46584c}.hero{background:linear-gradient(145deg,#294b36,#192a20);border:1px solid #ffffff13;border-radius:32px;text-align:center;padding:24px;margin:18px 0;position:relative;overflow:hidden}.face{font-size:58px}.muted,small{color:var(--muted)}#sum{font-size:clamp(34px,10vw,52px);font-weight:750;letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:10px 0}.track{height:8px;background:#ffffff20;border-radius:20px;overflow:hidden;margin:20px 0 10px}.bar{height:100%;background:var(--green);transition:width .6s,background .4s}.actions button{flex:1;padding:20px;background:#20382a;color:var(--green);font-weight:600}.actions button:last-child{background:#392728;color:var(--red)}.actions b{display:block;font-size:30px}.list{background:var(--card);border-radius:24px;padding:0 16px}.op{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #ffffff12}.op:last-child{border:0}.op div{flex:1;overflow-wrap:anywhere}.op small{display:block}.op button{padding:7px;background:transparent}.pos{color:var(--green)}.neg{color:var(--red)}nav{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(440px,92%);display:flex;background:#27382de8;backdrop-filter:blur(2 </style><main><h1>Mon Budget</h1><div class="tabs"><button id="joint" onclick="switchTab('joint')">Compte joint</button><button id="perso" onclick="switchTab('perso')">Compte perso</button></div><section id="budget"><div class="hero" id="hero"><div class="face" id="face">😢</div><small>SOLDE DISPONIBLE</small><div id="sum">0,00 €</div><div class="delta" id="delta"></div><div class="track"><div class="bar" id="bar"></div></div><small id="goal"></small></div><div class="actions"><button onclick="openForm(1)"><b>＋</b>Dépôt</button><button onclick="openForm(-1)"><b>−</b>Dépense</button></div><button class="quick" id="mess" onclick="quick()">🍽️ Repas au mess · 5,38 €</button></section><section id="stats" hidden></section><section id="history"><h2 id="heading">Dernières opérations</h2><div class="list" id="list"></div></section><p><small>Version locale · Synchronisation non connectée</small></p></main><nav><button onclick="view('budget')" id="navbudget">◉ Budget</button><button onclick="view('history')" id="navhistory">◷ Historique</button><button onclick="view('stats')" id="navstats">◔ Statistiques</button></nav><dialog id="sheet"><button class="close" onclick="sheet.close()">✕</button><h2 id="formTitle"></h2><form id="form"><label>Montant exact (€)<input id="amount" inputmode="decimal" placeholder="0,00" required></label><label>Motif (facultatif)<input id="reason" maxlength="120" placeholder="Courses, virement…"></label><label id="authorLabel">Auteur<input id="author" maxlength="40" placeholder="Moi"></label><button class="save">Valider</button></form></dialog><script>
const $=id=>document.getElementById(id),sheet=$('sheet'),fmt=c=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(c/100);let data;try{data=JSON.parse(localStorage.getItem('mon-budget-v1'))||{joint:[],perso:[]}}catch{data={joint:[],perso:[]}}let tab='joint',page='budget',sign=1,editing=null,shown=0,raf=0;const month=()=>new Date().toLocaleDateString('fr-CA').slice(0,7);function save(){try{localStorage.setItem('mon-budget-v1',JSON.stringify(data))}catch{alert('Sauvegarde locale impossible.')}}function switchTab(t){tab=t;render();}function view(p){page=p;render()}function openForm(s,id=null){sign=s;editing=id;let op=data[tab].find(x=>x.id===id);$('formTitle').textContent=id?'Modifier':s>0?'Nouveau dépôt':'Nouvelle dépense';$('amount').value=op?String(Math.abs(op.c)/100).replace('.',','):'';$('reason').value=op?.reason||'';$('author').value=op?.author||'';$('authorLabel').hidden=tab==='perso';sheet.showModal();$('amount').focus()}function add(c,reason,author){let old=data[tab].find(x=>x.id===editing);let op={id:old?.id||crypto.randomUUID?.()||String(Date.now()),c,reason,author,date:old?.date||new Date().toISOString()};if(old)data[tab]=data[tab].map(x=>x.id===editing?op:x);else data[tab].unshift(op);save();render(c-(old?.c||0));editing=null}function quick(){editing=null;add(-538,'Repas au mess','')} $('form').onsubmit=e=>{e.preventDefault();let raw=$('amount').value.trim().replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(raw)||Number(raw)<=0||Number(raw)>1000000){alert('Saisis un montant positif avec deux décimales maximum.');return}add(sign*Math.round(Number(raw)*100),$('reason').value.trim()||(sign>0?'Dépôt':'Dépense'),$('author').value.trim()||'Moi');sheet.close()};function remove(id){if(confirm('Supprimer cette opération ?')){data[tab]=data[tab].filter(x=>x.id!==id);save();render()}}function render(diff=0){let a=data[tab],b=a.reduce((s,x)=>s+x.c,0),m=a.filter(x=>x.date.slice(0,7)===new Date().toISOString().slice(0,7)),inc=m.reduce((s,x)=>s+Math.max(0,x.c),0),out=m.reduce((s,x)=>s+Math.max(0,-x.c),0),ref=tab==='joint'?50000:Math.max(1,a.reduce((s,x)=>s+Math.max(0,x.c),0)),r=b/ref;for(let t of ['joint','perso'])$(t).classList.toggle('active',t===tab);for(let p of ['budget','history','stats'])$('nav'+p).classList.toggle('active',p===page);$('budget').hidden=page!=='budget';$('history').hidden=page==='stats';$('stats').hidden=page!=='stats';$('mess').hidden=tab!=='perso';$('heading').textContent=page==='history'?'Historique':'Dernières opérations';let face=r<=0?'😢':r<=.2?'😟':r<=.4?'😐':r<=.6?'🙂':r<=.8?'😊':'😁';if($('face').textContent!==face){$('face').textContent=face;$('face').animate([{transform:'scale(.7)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:350})}let color=r<=0?'var(--red)':r<=.2?'#eaa44f':r<=.4?'#d8b94f':'var(--green)';$('sum').style.color=color;$('bar').style.background=color;$('bar').style.width=Math.max(0,Math.min(100,r*100))+'%';$('goal').textContent=tab==='joint'?'Objectif mensuel : 500 €':'Compte personnel privé sur cet appareil';cancelAnimationFrame(raf);let start=diff?shown:b,t=performance.now();function tick(now){let p=Math.min(1,(now-t)/550);shown=start+(b-start)*(1-(1-p)**3);$('sum').textContent=fmt(Math.round(shown));if(p<1)raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick);if(diff){let d=$('delta');d.textContent=(diff>0?'+':'−')+fmt(Math.abs(diff));d.style.color=diff>0?'var(--green)':'var(--red)';d.animate([{opacity:1,transform:'translateY(25px)'},{opacity:0,transform:`translateY(${diff>0?-45:65}px)`}],{duration:1100,fill:'forwards'})}let list=$('list');list.replaceChildren();for(let x of (page==='history'?a:a.slice(0,5))){let row=document.createElement('div');row.className='op';let info=document.createElement('div'),name=document.createElement('strong'),sub=document.createElement('small');name.textContent=x.reason;sub.textContent=new Date(x.date).toLocaleDateString('fr-FR')+(tab==='joint'?' · '+x.author:'');info.append(name,sub);let value=document.createElement('span');value.className=x.c>0?'pos':'neg';value.textContent=(x.c>0?'+':'−')+fmt(Math.abs(x.c));let edit=document.createElement('button');edit.textContent='✎';edit.setAttribute('aria-label','Modifier');edit.onclick=()=>openForm(Math.sign(x.c),x.id);let del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','Supprimer');del.onclick=()=>remove(x.id);row.append(info,value,edit,del);list.append(row)}if(!a.length){let p=document.createElement('p');p.style.padding='18px 0';p.textContent='Aucune opération';list.append(p)}$('stats').innerHTML='<h2>Ce mois-ci</h2><div class="list"><div class="summary">Dépôts <strong class="pos">'+fmt(inc)+'</strong></div><div class="summary">Dépenses <strong class="neg">'+fmt(out)+'</strong></div><div class="summary">Solde actuel <strong>'+fmt(b)+'</strong></div></div>'}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
