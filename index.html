:root{color-scheme:dark;--bg:#101114;--fg:#f6f3eb;--muted:#a9a9b3;--gold:#ddc18a;--glass:#ffffff0b;--line:#ffffff20;--green:#80d6a1;--red:#ff929b}*{box-sizing:border-box}body{margin:0;color:var(--fg);background:radial-gradient(ellipse at 90% 0,#52452d66,transparent 45%),radial-gradient(ellipse at 0 45%,#344b493d,transparent 55%),var(--bg);background-attachment:fixed;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;min-height:100vh}main{max-width:560px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 18px 120px}h1{font-size:30px;letter-spacing:-1.3px;margin:0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}small,.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:10px}.spread{justify-content:space-between}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.card{background:linear-gradient(145deg,#ffffff10,#ffffff04);border:1px solid var(--line);box-shadow:inset 0 1px #ffffff15,0 12px 30px #0002;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:24px;padding:18px;margin:14px 0}.big{font-size:clamp(30px,9vw,46px);font-weight:650;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:10px 0}.gold{color:var(--gold)}.pos{color:var(--green)}.neg{color:var(--red)}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:var(--glass);border-radius:16px;padding:12px;cursor:pointer;transition:transform .15s}button:active{transform:scale(.96)}button.primary{background:var(--gold);color:#17140f;font-weight:650;border:0}button.tiny{padding:7px 10px;font-size:13px}button.wide{width:100%;margin-top:8px}.tabs{display:flex;gap:5px;padding:5px;border:1px solid var(--line);background:var(--glass);border-radius:24px;margin-top:20px}.tabs button{flex:1;border:0;background:transparent}.tabs .active,nav .active{background:#d6bc8626;color:var(--gold)}nav{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(96%,5 </style></head><body><main><div class="row spread"><div><h1>Mon Budget <small class="gold">2.0</small></h1><div id="status" role="status">Chargement…</div></div><button id="eye" onclick="privacy()" aria-label="Masquer les montants">◉</button><button onclick="settings()" aria-label="Réglages">⚙</button></div><div class="tabs"><button id="joint" onclick="switchTab('joint')">Compte joint</button><button id="perso" onclick="switchTab('perso')">Compte perso</button></div><div id="content"></div><small>Mode local · Pas encore synchronisé</small></main><nav id="nav"></nav><dialog id="sheet"><div class="row spread"><h2 id="title"></h2><button class="tiny" onclick="sheet.close()">✕</button></div><form id="form"></form></dialog><script>
'use strict';const $=id=>document.getElementById(id),sheet=$('sheet'),KEY='mon-budget-v2',OLD='mon-budget-v1';const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const now=()=>new Date().toISOString();const month=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;const opMonth=o=>month(new Date(o.date));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=c=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(c/100);let tab='joint',page='budget',hidden=false,query='',filter='all',db=null,data,busy=false;const fmt=c=>hidden?'•••• €':money(c);const seed=()=>({version:2,rev:0,joint:[],perso:[],goals:[],charges:[['Orange',4190],['EDF',4400],['Engie',24710],['Assurance auto',12185],['Amazon Prime',699],['YouTube',3190]].map(([name,c])=>({id:uid(),name,c,day:''})),budgets:{},defaultBudget:50000,theme:'dark'});const valid=d=>d&&d.version===2&&Array.isArray(d.joint)&&Array.isArray(d.perso)&&Array.isArray(d.goals)&&Array.isArray(d.charges)&&d.budgets&&Number.isFinite(d.rev);function local(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}function openDB(){return new Promise(resolve=>{try{let r=indexedDB.open('mon-budget',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>{db=r.result;resolve(true)};r.onerror=()=>resolve(false);r.onblocked=()=>resolve(false)}catch{resolve(false)}})}function readDB(){return new Promise(resolve=>{if(!db)return resolve(null);try{let r=db.transaction('state').objectStore('state').get(KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch{resolve(null)}})}function writeDB(snapshot){return new Promise(resolve=>{if(!db)return resolve(false);try{let t=db.transaction('state','readwrite');t.objectStore('state').put(snapshot,KEY);t.oncomplete=()=>resolve(true);t.onerror=t.onabort=()=>resolve(false)}catch{resolve(false)}})}async function persist(){const snapshot=JSON.parse(JSON.stringify(data));let a=false;try{localStorage.setItem(KEY,JSON.stringify(snapshot));a=true}catch{}$('status').textContent='Sauvegarde…';let b=await writeDB(snapshot);$('status').textContent=a&&b?'✓ Double sauvegarde locale':a||b?'✓ Sauvegarde locale (une copie)':'⚠ Sauvegarde impossible — exporter';$('status').style.color=a||b?'var(--green)':'var(--red)';return a||b}async function commit(fn){if(busy)return;busy=true;try{fn();data.rev=Math.max(Date.now(),data.rev+1);render();await persist()}finally{busy=false}}async function init(){await openDB();let a=local(KEY),b=await readDB();data=[a,b].filter(valid).sort((x,y)=>y.rev-x.rev)[0];if(!data){data=seed();let old=local(OLD);if(old&&Array.isArray(old.joint)&&Array.isArray(old.perso)){for(let t of ['joint','perso'])data[t]=old[t].filter(o=>Number.isSafeInteger(o.c)).map(o=>({...o,category:o.reason||'Autre',kind:'normal'}))}}render();await persist();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}const balance=(t=tab)=>data[t].reduce((s,o)=>s+o.c,0);const budget=()=>data.budgets[month()]??data.defaultBudget;const monthly=(t=tab,m=month())=>data[t].filter(o=>opMonth(o)===m);const spent=()=>monthly('joint').filter(o=>o.c<0&&o.category==='Courses'&&o.kind==='normal').reduce((s,o)=>s-o.c,0);const paid=c=>monthly('joint').find(o=>o.chargeId===c.id);const remaining=()=>data.charges.filter(c=>!paid(c)).reduce((s,c)=>s+c.c,0);const goalSum=g=>g.moves.reduce((s,o)=>s+o.c,0);const cats=['Courses','Virement','Cantine Jade','Restaurant','Carburant','Loisirs','Shopping','Santé','Repas au mess','Autre'];function switchTab(t){tab=t;page='budget';query='';filter='all';render()}function go(p){page=p;render()}function privacy(){hidden=!hidden;render()}function bar(n,color='var(--gold)'){return `<div class="track"><div class="bar" style="width:${Math.max(0,Math.min(100,n))}%;background:${color}"></div></div>`}function field(name,label,value='',type='text'){return `<label>${label}<input name="${name}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(value)}" required></label>`}function select(name,label,options,value){return `<label>${label}<select name="${name}">${options.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}function cents(v,negative=false){let s=String(v).trim().replace(',','.');if(!(negative?/^-?\d+(\.\d{1,2})?$/:/^\d+(\.\d{1,2})?$/).test(s)||Math.abs(Number(s))>10000000||(!negative&&Number(s)<=0))throw Error('Montant invalide (deux décimales maximum).');return Math.round(Number(s)*100)}function modal(title,html,fn){$('title').textContent=title;$('form').innerHTML=html+'<button class="primary wide">Confirmer</button>';$('form').onsubmit=async e=>{e.preventDefault();try{await fn(Object.fromEntries(new FormData(e.target)));sheet.close()}catch(err){alert(err.message)}};sheet.showModal()}function op(c,category,author,extra={}){return {id:uid(),c,category,reason:category,author,date:now(),kind:'normal',...extra}}function operation(sign,id){let t=tab,old=data[t].find(o=>o.id===id);let options=[...new Set([...cats,old?.category].filter(Boolean))];modal(old?'Modifier l’opération':sign>0?'Nouveau dépôt':'Nouvelle dépense',field('amount','Montant (€)',old?Math.abs(old.c)/100:'','number')+select('category','Motif',options,old?.category||(sign>0?'Virement':'Courses'))+(t==='joint'?select('author','Auteur',['Dams','Nalex'],old?.author||'Dams'):'')+`<label>Commentaire facultatif<input name="note" value="${esc(old?.note||'')}"></label>`,v=>{let c=sign*cents(v.amount);return commit(()=>{let o=op(c,v.category,v.author||'',{note:v.note});if(old)data[t]=data[t].map(x=>x.id===id?{...old,...o,id:old.id,date:old.date}:x);else data[t].unshift(o)})})}function adjust(){let t=tab;modal('Ajuster le solde',field('amount','Solde bancaire exact (€)',balance()/100,'number')+(t==='joint'?select('author','Auteur',['Dams','Nalex'],'Dams'):''),v=>{let c=cents(v.amount,true)-balance(t);return commit(()=>{if(c)data[t].unshift(op(c,'Ajustement',v.author||'',{kind:'adjust'}))})})}function setBudget(){modal('Budget courses mensuel',field('amount','Objectif (€)',budget()/100,'number'),v=>{let c=cents(v.amount);return commit(()=>{data.defaultBudget=c;data.budgets[month()]=c})})}function remove(id){let t=tab,o=data[t].find(x=>x.id===id);if(!o||o.kind==='saving')return;if(confirm('Annuler cette opération ?'))commit(()=>data[t]=data[t].filter(x=>x.id!==id))}function chargeForm(id){let c=data.charges.find(x=>x.id===id);modal(c?'Modifier la charge':'Nouvelle charge',field('name','Nom',c?.name)+field('amount','Montant (€)',c?c.c/100:'','number')+`<label>Jour du mois (facultatif)<input name="day" type="number" min="1" max="31" value="${esc(c?.day||'')}"></label>`,v=>{let amount=cents(v.amount);return commit(()=>{let x={id:c?.id||uid(),name:v.name.trim(),c:amount,day:v.day};if(!x.name)throw Error('Nom obligatoire');if(c)data.charges=data.charges.map(y=>y.id===id?x:y);else data.charges.push(x)})})}function validateCharge(id){let c=data.charges.find(x=>x.id===id);if(!c||paid(c))return;modal('Confirmer le prélèvement',`<p>${esc(c.name)} · ${fmt(c.c)}</p>`+field('amount','Montant réellement prélevé (€)',c.c/100,'number')+select('author','Auteur',['Dams','Nalex'],'Dams'),v=>{let n=cents(v.amount);return commit(()=>{if(!paid(c))data.joint.unshift(op(-n,c.name,v.author,{chargeId:id}))})})}function deleteCharge(id){if(confirm('Supprimer le modèle ? Les opérations passées restent enregistrées.'))commit(()=>data.charges=data.charges.filter(c=>c.id!==id))}function goalForm(id){let g=data.goals.find(x=>x.id===id);modal(g?'Modifier l’objectif':'Nouvel objectif',field('name','Nom',g?.name)+field('emoji','Emoji',g?.emoji||'🎯')+field('target','Objectif (€)',g?g.target/100:'','number')+`<label>Date cible (facultative)<input type="date" name="date" value="${esc(g?.date||'')}"></label>`,v=>{let target=cents(v.target);return commit(()=>{if(g)Object.assign(g,{name:v.name,emoji:v.emoji,target,date:v.date});else data.goals.push({id:uid(),name:v.name,emoji:v.emoji,target,date:v.date,moves:[]})})})}function moveGoal(id,sign){let g=data.goals.find(x=>x.id===id);modal(sign>0?'Verser sur l’épargne':'Retirer de l’épargne',field('amount','Montant (€)','','number')+select('source',sign>0?'Provenance':'Destination',['Compte perso','Extérieur'],'Compte perso'),v=>{let c=sign*cents(v.amount);if(goalSum(g)+c<0)throw Error('Épargne insuffisante');let before=goalSum(g);return commit(()=>{let mid=uid();g.moves.unshift({id:mid,c,source:v.source,date:now()});if(v.source==='Compte perso')data.perso.unshift(op(-c,g.name,'',{kind:'saving',moveId:mid}));if(before<g.target&&goalSum(g)>=g.target)setTimeout(()=>alert('🎉 Objectif atteint !'),100)})})}function undoMove(gid,mid){let g=data.goals.find(x=>x.id===gid),m=g.moves.find(x=>x.id===mid);if(goalSum(g)-m.c<0)return alert('Annulation impossible : épargne insuffisante.');if(confirm('Annuler ce mouvement ?'))commit(()=>{g.moves=g.moves.filter(x=>x.id!==mid);data.perso=data.perso.filter(x=>x.moveId!==mid)})}function deleteGoal(id){let g=data.goals.find(x=>x.id===id);if(goalSum(g)!==0||g.moves.length)return alert('Annule les mouvements avant de supprimer cet objectif.');if(confirm('Supprimer cet objectif ?'))commit(()=>data.goals=data.goals.filter(x=>x.id!==id))}function chart(){let a=[...data[tab]].sort((x,y)=>x.date.localeCompare(y.date)),v=[0];for(let o of a)v.push(v.at(-1)+o.c);v=v.slice(-30);if(v.length===1)v.push(v[0]);let lo=Math.min(...v),hi=Math.max(...v),p=v.map((x,i)=>`${i*320/(v.length-1)},${75-(x-lo)/(hi-lo||1)*65}`).join(' ');return `<svg viewBox="0 0 320 90" preserveAspectRatio="none" aria-label="Évolution du solde"><defs><linearGradient id="fade" x2="0" y2="1"><stop stop-color="#d6bc86" stop-opacity=".25"/><stop offset="1" stop-color="#d6bc86" stop-opacity="0"/></linearGradient></defs><polygon points="0,90 ${p} 320,90" fill="url(#fade)"/><polyline points="${p}" fill="none" stroke="#d6bc86" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}function rows(a){return a.length?a.map(o=>`<div class="row line"><div class="grow"><strong>${esc(o.category||o.reason)}</strong><br><small>${new Date(o.date).toLocaleDateString('fr-FR')} ${esc(o.author||'')} ${esc(o.note||'')}</small></div><strong class="${o.c>=0?'pos':'neg'}">${fmt(o.c)}</strong>${o.kind==='normal'&&!o.chargeId?`<button class="tiny" onclick="operation(${Math.sign(o.c)},'${o.id}')">✎</button>`:''}${o.kind!=='saving'?`<button class="tiny" onclick="remove('${o.id}')">×</button>`:''}</div>`).join(''):'<p class="muted">Aucune opération</p>'}function totals(a){return [a.filter(o=>o.kind==='normal'&&o.c>0).reduce((s,o)=>s+o.c,0),a.filter(o=>o.kind==='normal'&&o.c<0).reduce((s,o)=>s-o.c,0)]}function render(){if(!data)return;document.body.classList.toggle('light',data.theme==='light');for(let t of ['joint','perso'])$(t).classList.toggle('active',tab===t);$('eye').textContent=hidden?'⊘':'◉';let pages=[['budget','◈','Budget'],[tab==='joint'?'charges':'goals',tab==='joint'?'▤':'◎',tab==='joint'?'Charges':'Épargnes'],['history','↔','Historique'],['stats','▥','Analyses']];$('nav').innerHTML=pages.map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><b>${i}</b>${n}</button>`).join('');let b=balance(),s=spent(),target=budget(),ratio=s/target*100,[inc,out]=totals(monthly());let h='';if(page==='budget'){h=`<div class="card"><div class="row spread"><small>Solde disponible</small><button class="tiny" onclick="adjust()">Ajuster</button></div><div class="big">${fmt(b)}</div>${hidden?'':chart()}<small>${tab==='joint'?'Dams & Nalex':'Compte personnel local'}</small></div><div class="grid"><div class="card"><small>Dépôts ce mois</small><h2 class="pos">${fmt(inc)}</h2></div><div class="card"><small>Dépenses ce mois</small><h2 class="neg">${fmt(out)}</h2></div><button class="primary" onclick="operation(1)">＋ Dépôt</button><button onclick="operation(-1)">− Dépense</button></div>`;if(tab==='joint')h+=`<div class="card"><div class="row spread"><h2>Budget courses ${ratio>=100?'😟':ratio>=75?'😐':'🙂'}</h2><button class="tiny" onclick="setBudget()">Modifier</button></div><small>Restant ce mois</small><div class="big ${s>target?'neg':'gold'}">${fmt(target-s)}</div>${bar(ratio,ratio>=100?'var(--red)':ratio>=75?'#e5a05c':'var(--gold)')}<div class="row spread"><small>${fmt(s)} / ${fmt(target)}</small><small>${Math.round(ratio)} %</small></div></div><div class="card"><small>Solde prévisionnel après charges restantes</small><div class="big">${fmt(b-remaining())}</div><small>Charges à venir : ${fmt(remaining())}</small></div>`;else h+=`<button class="wide" onclick="commit(()=>data.perso.unshift(op(-538,'Repas au mess','')))">🍽️ Repas au mess · ${fmt(538)}</button><div class="card" onclick="go('goals')"><small>Mes épargnes</small><div class="big gold">${fmt(data.goals.reduce((a,g)=>a+goalSum(g),0))}</div></div>`;h+=`<div class="card"><h2>Dernières opérations</h2>${rows(data[tab].slice(0,5))}</div>`}if(page==='charges'){h=`<div class="card"><div class="row spread"><h2>Charges récurrentes</h2><button class="tiny primary" onclick="chargeForm()">＋ Ajouter</button></div><small>Reste à prélever</small><div class="big gold">${fmt(remaining())}</div><small>Prévision : ${fmt(b-remaining())}</small></div>`+data.charges.map(c=>{let p=paid(c);return `<div class="card"><div class="row"><div class="grow"><h3>${esc(c.name)}</h3><small>${c.day?'Jour '+esc(c.day)+' · ':''}${p?'Validé par '+esc(p.author):'En attente'}</small></div><strong>${fmt(p?-p.c:c.c)}</strong><button class="tiny" onclick="chargeForm('${c.id}')">✎</button><button class="tiny" onclick="deleteCharge('${c.id}')">×</button></div><button class="wide ${p?'':'primary'}" onclick="${p?`remove('${p.id}')`:`validateCharge('${c.id}')`}">${p?'✓ Prélevé · Annuler':'Valider le prélèvement'}</button></div>`}).join('')}if(page==='goals'){h=`<div class="card"><div class="row spread"><h2>Mes épargnes</h2><button class="tiny primary" onclick="goalForm()">＋ Objectif</button></div><small>Total épargné</small><div class="big gold">${fmt(data.goals.reduce((a,g)=>a+goalSum(g),0))}</div></div>`+data.goals.map(g=>{let s=goalSum(g),r=s/g.target*100;return `<div class="card"><div class="row"><h2 class="grow">${esc(g.emoji)} ${esc(g.name)}</h2><button class="tiny" onclick="goalForm('${g.id}')">✎</button><button class="tiny" onclick="deleteGoal('${g.id}')">×</button></div><div class="big gold">${fmt(s)}</div><small>Objectif ${fmt(g.target)} · ${Math.round(r)} % ${esc(g.date||'')}</small>${bar(r)}<small>${s>=g.target?'🎉 Objectif atteint !':'Reste '+fmt(g.target-s)}</small><div class="grid" style="margin-top:12px"><button class="primary" onclick="moveGoal('${g.id}',1)">＋ Verser</button><button onclick="moveGoal('${g.id}',-1)">− Retirer</button></div><details><summary style="margin-top:12px">Historique</summary>${g.moves.map(m=>`<div class="row line"><div class="grow"><small>${esc(m.source)} · ${new Date(m.date).toLocaleDateString('fr-FR')}</small></div>${fmt(m.c)}<button class="tiny" onclick="undoMove('${g.id}','${m.id}')">×</button></div>`).join('')}</details></div>`}).join('')}if(page==='history'){h=`<div class="card"><h2>Historique</h2><input id="search" placeholder="Rechercher…" value="${esc(query)}" oninput="query=this.value;historyRows()"><select onchange="filter=this.value;historyRows()"><option value="all" ${filter==='all'?'selected':''}>Toutes les opérations</option><option value="in" ${filter==='in'?'selected':''}>Entrées</option><option value="out" ${filter==='out'?'selected':''}>Sorties</option></select><div id="results"></div></div>`}if(page==='stats'){let prev=new Date();prev.setDate(1);prev.setMonth(prev.getMonth()-1);let [pi,po]=totals(monthly(tab,month(prev)));let groups={};for(let o of monthly().filter(o=>o.kind==='normal'&&o.c<0)){let k=o.category||'Autre';groups[k]=(groups[k]||0)-o.c}h=`<div class="card"><h2>Bilan mensuel</h2><div class="row line spread">Dépôts <strong class="pos">${fmt(inc)}</strong></div><div class="row line spread">Dépenses <strong class="neg">${fmt(out)}</strong></div><div class="row line spread">Dépenses mois précédent <strong>${fmt(po)}</strong></div><div class="row line spread">Écart <strong>${fmt(out-po)}</strong></div><div class="row line spread">Dépôts mois précédent <strong>${fmt(pi)}</strong></div></div><div class="card"><h2>Par catégorie</h2>${Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row spread"><span>${esc(k)}</span><strong>${fmt(v)}</strong></div>${bar(out?v/out*100:0)}`).join('')||'<small>Aucune dépense</small>'}</div>`;if(tab==='joint')h+=`<div class="card"><h2>Par auteur</h2>${['Dams','Nalex'].map(n=>{let [i,o]=totals(monthly().filter(x=>x.author===n));return `<div class="line"><strong>${n}</strong><div class="row spread"><small>Versé ${fmt(i)}</small><small>Dépensé ${fmt(o)}</small></div></div>`}).join('')}</div>`}$('content').innerHTML=h;if(page==='history')historyRows()}function historyRows(){let q=query.toLowerCase();$('results').innerHTML=rows(data[tab].filter(o=>(filter==='all'||(filter==='in'?o.c>0:o.c<0))&&[o.category,o.author,o.note,o.reason].join(' ').toLowerCase().includes(q)))}function settings(){modal('Réglages',select('theme','Apparence',['Sombre','Clair'],data.theme==='light'?'Clair':'Sombre')+`<button type="button" class="wide" onclick="exportData()">Exporter une sauvegarde JSON</button><label>Restaurer une sauvegarde<input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></label><p class="muted">Les données sont locales. Aucun compte distant ni synchronisation active. Garde tes sauvegardes privées.</p>`,v=>commit(()=>data.theme=v.theme==='Clair'?'light':'dark'))}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='Mon-Budget-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!valid(d)||!['joint','perso'].every(t=>d[t].every(o=>Number.isSafeInteger(o.c)&&typeof o.id==='string'&&/^[\w-]+$/.test(o.id)&&!isNaN(Date.parse(o.date))))||!d.charges.every(c=>/^[\w-]+$/.test(c.id)&&Number.isSafeInteger(c.c)&&c.c>0)||!d.goals.every(g=>/^[\w-]+$/.test(g.id)&&Number.isSafeInteger(g.target)&&g.target>0&&Array.isArray(g.moves)&&g.moves.every(m=>/^[\w-]+$/.test(m.id)&&Number.isSafeInteger(m.c))))throw Error('Sauvegarde invalide');if(confirm('Remplacer toutes les données locales ?')){await commit(()=>data=d);sheet.close()}}catch(e){alert(e.message)}}init().catch(e=>{$('status').textContent='Erreur de démarrage : '+e.message});
</script></body></html>
